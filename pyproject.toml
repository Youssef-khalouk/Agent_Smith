[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-smith"
version = "0.1.0"
description = "Autonomous reasoning, code generation, and execution agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "docker>=7.0.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
sandbox = "sandbox.cli:main"
